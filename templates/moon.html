<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Moon Finder</title>
    <style>
        :root {
            --bg: #060a08;
            --bg-panel: #0b110d;
            --bg-panel-2: #0f1712;
            --border: #1a2e22;
            --border-bright: #2b5c3e;
            --text: #d9f5e6;
            --text-dim: #7fa593;
            --green: #39ff8a;
            --green-bright: #7dffb0;
            --green-dim: #1c7a48;
            --sun: #ffd93b;
            font-size: 16px
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden
        }

        body {
            background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(57, 255, 138, .08), transparent), var(--bg);
            color: var(--text);
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            line-height: 1.5
        }

        #cam,
        #c {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%
        }

        #cam {
            object-fit: cover;
            display: none
        }

        #c {
            pointer-events: none
        }

        #safe {
            position: fixed;
            top: 0;
            height: env(safe-area-inset-top, 0px);
            visibility: hidden
        }

        h1 {
            font-size: 2.1rem;
            margin: 0 0 .4rem;
            letter-spacing: -.02em;
            text-shadow: 0 0 24px rgba(57, 255, 138, .25)
        }

        .sub {
            color: var(--text-dim);
            margin: 0 0 1.5rem;
            font-size: .95rem
        }

        .tag {
            font-size: .68rem;
            padding: .15rem .5rem;
            border: 1px solid var(--green-dim);
            color: var(--green);
            background: rgba(57, 255, 138, .05);
            text-transform: uppercase;
            letter-spacing: .05em;
            white-space: nowrap
        }

        .tag.sun {
            border-color: #8a7414;
            color: var(--sun);
            background: rgba(255, 217, 59, .06)
        }

        button {
            font-family: inherit;
            font-size: .83rem;
            font-weight: 600;
            padding: .55rem 1rem;
            border-radius: 0;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background .12s ease, border-color .12s ease, box-shadow .12s ease
        }

        .btn-primary {
            background: var(--green);
            color: #04140b;
            border-color: var(--green)
        }

        .btn-primary:hover {
            background: var(--green-bright);
            border-color: var(--green-bright);
            box-shadow: 0 0 14px rgba(57, 255, 138, .4)
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-dim);
            border-color: var(--border)
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--border-bright)
        }

        .btn-ghost.on {
            color: #04140b;
            background: var(--green);
            border-color: var(--green)
        }

        .hud {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            padding: .9rem 1rem calc(.9rem + env(safe-area-inset-bottom, 0px));
            background: rgba(11, 17, 13, .88);
            border-top: 1px solid var(--border-bright);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            gap: .5rem
        }

        .row {
            display: flex;
            align-items: center;
            gap: .6rem;
            font-size: .82rem;
            color: var(--text-dim)
        }

        .row b {
            color: var(--text);
            font-weight: 600
        }

        #st {
            font-size: .75rem;
            color: var(--text-dim)
        }

        .actions {
            display: flex;
            gap: .6rem
        }

        #intro {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(57, 255, 138, .08), transparent), var(--bg)
        }

        #intro .box {
            border: 1px solid var(--border);
            background: var(--bg-panel);
            padding: 2rem 1.75rem;
            max-width: 400px
        }
    </style>
</head>

<body>
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="c"></canvas>
    <div id="safe"></div>

    <div class="hud">
        <div class="row"><span class="tag">Moon</span><span id="mi">—</span></div>
        <div class="row"><span class="tag sun">Sun</span><span id="si">—</span></div>
        <div id="st">Waiting to start…</div>
        <div class="actions"><button id="camBtn" class="btn-ghost">Camera: off</button></div>
    </div>

    <div id="intro">
        <div class="box">
            <h1>Moon Finder</h1>
            <p class="sub">Point your phone at the sky. Uses GPS, motion sensors and (optionally) the camera to locate
                the moon and sun, even below the horizon.</p>
            <button id="go" class="btn-primary">Start</button>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id), D = Math.PI / 180, R = 180 / Math.PI;
        const cv = $('c'), ctx = cv.getContext('2d'), vid = $('cam'), hud = document.querySelector('.hud');
        const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        const G = css('--green'), GD = css('--green-dim'), SUN = css('--sun'), TXT = css('--text'), DIM = css('--text-dim');
        let W, H, f, safeTop = 0, pos = null, sm = null, Rm = null, A = null, absSeen = false, noNorth = false, gpsMsg = 'Waiting for GPS…';
        const FONT = '"Inter","Segoe UI",system-ui,sans-serif';

        function resize() {
            const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
            f = (Math.max(W, H) / 2) / Math.tan(33 * D); safeTop = $('safe').offsetHeight
        }
        addEventListener('resize', resize); resize();

        /* ---------- astronomy (SunCalc-style) ---------- */
        function astro(date, lat, lon) {
            const d = date / 864e5 - .5 + 2440588 - 2451545, phi = lat * D, e = D * 23.4397, sin = Math.sin, cos = Math.cos;
            const ra = (l, b) => Math.atan2(sin(l) * cos(e) - Math.tan(b) * sin(e), cos(l));
            const de = (l, b) => Math.asin(sin(b) * cos(e) + cos(b) * sin(e) * sin(l));
            const M = D * (357.5291 + .98560028 * d);
            const Ls = M + D * (1.9148 * sin(M) + .02 * sin(2 * M) + .0003 * sin(3 * M)) + D * 102.9372 + Math.PI;
            const s = { ra: ra(Ls, 0), dec: de(Ls, 0), dist: 149598000 };
            const L = D * (218.316 + 13.176396 * d), Mm = D * (134.963 + 13.064993 * d), F = D * (93.272 + 13.22935 * d);
            const l = L + D * 6.289 * sin(Mm), b = D * 5.128 * sin(F);
            const m = { ra: ra(l, b), dec: de(l, b), dist: 385001 - 20905 * cos(Mm) };
            const st = D * (280.16 + 360.9856235 * d) - (-lon * D);
            const hor = (o, par) => {
                const h = st - o.ra; let alt = Math.asin(sin(phi) * sin(o.dec) + cos(phi) * cos(o.dec) * cos(h));
                const az = Math.atan2(sin(h), cos(h) * sin(phi) - Math.tan(o.dec) * cos(phi));
                if (par) alt -= Math.asin(6371 / o.dist * cos(alt));
                return { az: (az * R + 180 + 360) % 360, alt: alt * R }
            };
            const dr = s.ra - m.ra, p2 = Math.acos(sin(s.dec) * sin(m.dec) + cos(s.dec) * cos(m.dec) * cos(dr));
            const inc = Math.atan2(s.dist * sin(p2), m.dist - s.dist * cos(p2));
            const ang = Math.atan2(cos(s.dec) * sin(dr), sin(s.dec) * cos(m.dec) - cos(s.dec) * sin(m.dec) * cos(dr));
            const phase = .5 + .5 * inc * (ang < 0 ? -1 : 1) / Math.PI;
            return { moon: { ...hor(m, 1), frac: (1 + cos(inc)) / 2, phase }, sun: hor(s, 0) }
        }
        function phaseName(p) { return p < .03 || p > .97 ? 'New moon' : p < .22 ? 'Waxing crescent' : p < .28 ? 'First quarter' : p < .47 ? 'Waxing gibbous' : p < .53 ? 'Full moon' : p < .72 ? 'Waning gibbous' : p < .78 ? 'Last quarter' : 'Waning crescent' }

        /* ---------- orientation / projection ---------- */
        function setR(a, b, g) {
            a *= D; b *= D; g *= D; const cA = Math.cos(a), sA = Math.sin(a), cB = Math.cos(b), sB = Math.sin(b), cG = Math.cos(g), sG = Math.sin(g);
            Rm = [[cA * cG - sA * sB * sG, -sA * cB, cA * sG + sA * sB * cG], [sA * cG + cA * sB * sG, cA * cB, sA * sG - cA * sB * cG], [-cB * sG, sB, cB * cG]]
        }
        const vec = (az, alt) => [Math.cos(alt * D) * Math.sin(az * D), Math.cos(alt * D) * Math.cos(az * D), Math.sin(alt * D)];
        function toScr(v) {
            const r = Rm;
            const dx = r[0][0] * v[0] + r[1][0] * v[1] + r[2][0] * v[2], dy = r[0][1] * v[0] + r[1][1] * v[1] + r[2][1] * v[2], dz = r[0][2] * v[0] + r[1][2] * v[1] + r[2][2] * v[2];
            let a = (screen.orientation && screen.orientation.angle) || window.orientation || 0; a = ((a % 360) + 360) % 360;
            const [sx, sy] = a == 90 ? [-dy, dx] : a == 180 ? [-dx, -dy] : a == 270 ? [dy, -dx] : [dx, dy];
            const front = dz < -.02;
            return { sx, sy, front, x: front ? W / 2 + f * sx / -dz : 0, y: front ? H / 2 - f * sy / -dz : 0 }
        }
        const fwd = () => [-Rm[0][2], -Rm[1][2], -Rm[2][2]];

        function onOri(e) {
            if (e.type === 'deviceorientationabsolute') absSeen = true; else if (absSeen) return;
            let a = e.alpha; if (e.webkitCompassHeading != null) a = 360 - e.webkitCompassHeading;
            if (a == null || e.beta == null || e.gamma == null) return;
            noNorth = !absSeen && e.webkitCompassHeading == null && !e.absolute;
            if (!sm) sm = { a, b: e.beta, g: e.gamma };
            else { const k = .35; sm.a = (sm.a + (((a - sm.a + 540) % 360) - 180) * k + 360) % 360; sm.b += (e.beta - sm.b) * k; sm.g += (e.gamma - sm.g) * k }
        }

        /* ---------- drawing ---------- */
        const RAD = 26;
        function drawMoon(p, m, ang) {
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
            ctx.beginPath(); ctx.arc(0, 0, RAD, 0, 7); ctx.fillStyle = 'rgba(57,255,138,.07)'; ctx.fill(); ctx.strokeStyle = GD; ctx.lineWidth = 1.5; ctx.stroke();
            const a = RAD * Math.abs(1 - 2 * m.frac);
            ctx.beginPath(); ctx.moveTo(0, -RAD); ctx.arc(0, 0, RAD, -Math.PI / 2, Math.PI / 2, false);
            if (m.frac < .5) ctx.ellipse(0, 0, a, RAD, 0, Math.PI / 2, -Math.PI / 2, true); else ctx.ellipse(0, 0, a, RAD, 0, Math.PI / 2, Math.PI * 1.5, false);
            ctx.closePath(); ctx.fillStyle = G; ctx.shadowColor = G; ctx.shadowBlur = 22; ctx.fill(); ctx.restore()
        }
        function drawSun(p) { ctx.save(); ctx.beginPath(); ctx.arc(p.x, p.y, RAD, 0, 7); ctx.fillStyle = SUN; ctx.shadowColor = SUN; ctx.shadowBlur = 30; ctx.fill(); ctx.restore() }
        function label(t, x, y, c) { ctx.save(); ctx.font = '600 11px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = c; ctx.shadowColor = '#000'; ctx.shadowBlur = 4; ctx.fillText(t, x, y); ctx.restore() }
        function arrow(p, c, t) {
            let ux = p.sx, uy = -p.sy; const n = Math.hypot(ux, uy) || 1; ux /= n; uy /= n; if (n < 1e-6) { ux = 0; uy = -1 }
            const top = safeTop + 72, bot = hud.offsetHeight + 16, mx = 30, cy = (top + H - bot) / 2, hh = (H - bot - top) / 2, hw = W / 2 - mx;
            const k = Math.min(hw / (Math.abs(ux) || 1e-9), hh / (Math.abs(uy) || 1e-9)), x = W / 2 + ux * k, y = cy + uy * k;
            ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(uy, ux)); ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -11); ctx.lineTo(-8, 11); ctx.closePath();
            ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 14; ctx.fill(); ctx.restore();
            label(t, x - ux * 34, y - uy * 34 + 4, c)
        }
        function compass(h, pitch) {
            const top = safeTop + 10, bh = 36, ppd = f * D, span = (W - 16) / ppd;
            ctx.save(); ctx.fillStyle = 'rgba(11,17,13,.88)'; ctx.fillRect(8, top, W - 16, bh); ctx.strokeStyle = '#2b5c3e'; ctx.lineWidth = 1; ctx.strokeRect(8.5, top + .5, W - 17, bh - 1);
            ctx.beginPath(); ctx.rect(8, top, W - 16, bh); ctx.clip();
            const N = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW']; ctx.textAlign = 'center';
            for (let d = Math.ceil((h - span / 2) / 5) * 5; d <= h + span / 2; d += 5) {
                const n = ((d % 360) + 360) % 360, x = W / 2 + (d - h) * ppd, maj = n % 45 == 0, mid = n % 15 == 0, len = maj ? 14 : mid ? 9 : 5;
                ctx.strokeStyle = maj ? G : '#2b5c3e'; ctx.beginPath(); ctx.moveTo(x, top + bh); ctx.lineTo(x, top + bh - len); ctx.stroke();
                if (maj) { ctx.font = '700 13px ' + FONT; ctx.fillStyle = n == 0 ? G : TXT; ctx.fillText(N[n / 45], x, top + 16) }
                else if (mid) { ctx.font = '10px ' + FONT; ctx.fillStyle = DIM; ctx.fillText(n, x, top + 16) }
            }
            [[A.moon, G, 1], [A.sun, SUN, 0]].forEach(([o, c, sq]) => {
                const dd = ((o.az - h + 540) % 360) - 180; if (Math.abs(dd) < span / 2) {
                    const x = W / 2 + dd * ppd; ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 8;
                    ctx.beginPath(); if (sq) ctx.rect(x - 4, top + 3, 8, 8); else ctx.arc(x, top + 7, 4.5, 0, 7); ctx.fill()
                }
            });
            ctx.restore();
            ctx.fillStyle = G; ctx.beginPath(); ctx.moveTo(W / 2 - 6, top + bh + 1); ctx.lineTo(W / 2 + 6, top + bh + 1); ctx.lineTo(W / 2, top + bh + 8); ctx.fill();
            label(Math.round(h) + '°  ' + (pitch >= 0 ? '↑' : '↓') + ' ' + Math.abs(Math.round(pitch)) + '°', W / 2, top + bh + 23, TXT)
        }
        function horizon() {
            ctx.save(); ctx.strokeStyle = GD; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]); ctx.beginPath(); let pen = false, lx = 0;
            for (let az = 0; az <= 360; az += 3) { const p = toScr(vec(az, 0)); if (p.front && Math.abs(p.x) < W * 4) { if (pen && Math.abs(p.x - lx) < W) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y); pen = true; lx = p.x } else pen = false }
            ctx.stroke(); ctx.restore()
        }
        function body(o, kind, name) {
            const v = vec(o.az, o.alt), p = toScr(v), F = fwd(), dist = Math.acos(Math.max(-1, Math.min(1, F[0] * v[0] + F[1] * v[1] + F[2] * v[2]))) * R;
            const c = kind == 'moon' ? G : SUN, m = RAD + 4, on = p.front && p.x > -m && p.x < W + m && p.y > -m && p.y < H + m;
            if (!on) { arrow(p, c, name + ' ' + Math.round(dist) + '°'); return }
            if (kind == 'moon') {
                const S = vec(A.sun.az, A.sun.alt), dot = S[0] * v[0] + S[1] * v[1] + S[2] * v[2], t = S.map((s, i) => s - dot * v[i]), tn = Math.hypot(...t) || 1;
                const v2 = v.map((x, i) => x + .03 * t[i] / tn), q = toScr(v2);
                drawMoon(p, o, q.front ? Math.atan2(q.y - p.y, q.x - p.x) : 0)
            }
            else drawSun(p);
            label(name + (o.alt < 0 ? ' · below horizon' : ''), p.x, p.y + RAD + 18, c)
        }

        function frame() {
            requestAnimationFrame(frame); ctx.clearRect(0, 0, W, H);
            if (!sm || !pos) return;
            setR(sm.a, sm.b, sm.g); A = astro(new Date(), pos.lat, pos.lon);
            const F = fwd(), h = (Math.atan2(F[0], F[1]) * R + 360) % 360, pitch = Math.asin(F[2]) * R;
            horizon(); body(A.sun, 'sun', 'SUN'); body(A.moon, 'moon', 'MOON'); compass(h, pitch)
        }

        /* ---------- HUD ---------- */
        setInterval(() => {
            const st = $('st');
            if (!pos || !sm) { st.textContent = !pos ? gpsMsg : 'Waiting for motion sensors… (needs a phone/tablet)'; }
            else st.textContent = gpsMsg + (noNorth ? ' · compass may not point to true north' : '');
            if (!A || !pos || !sm) return;
            const m = A.moon, s = A.sun, fx = v => v.toFixed(1) + '°';
            $('mi').innerHTML = `<b>${phaseName(m.phase)}</b> · ${Math.round(m.frac * 100)}% lit · Az ${fx(m.az)} · Alt ${fx(m.alt)}${m.alt < 0 ? ' (below horizon)' : ''}`;
            $('si').innerHTML = `Az <b>${fx(s.az)}</b> · Alt <b>${fx(s.alt)}</b>${s.alt < 0 ? ' (below horizon)' : ''}`
        }, 250);

        /* ---------- camera ---------- */
        let stream = null; const cb = $('camBtn');
        cb.onclick = async () => {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; vid.srcObject = null; vid.style.display = 'none'; cb.textContent = 'Camera: off'; cb.classList.remove('on'); return }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
                vid.srcObject = stream; vid.style.display = 'block'; await vid.play(); cb.textContent = 'Camera: on'; cb.classList.add('on')
            }
            catch (e) { stream = null; gpsMsg = 'Camera unavailable (needs HTTPS + permission)' }
        };

        /* ---------- start ---------- */
        $('go').onclick = async () => {
            if (navigator.geolocation) navigator.geolocation.watchPosition(
                p => { pos = { lat: p.coords.latitude, lon: p.coords.longitude }; gpsMsg = 'GPS ±' + Math.round(p.coords.accuracy) + ' m' },
                e => { gpsMsg = 'GPS error: ' + e.message }, { enableHighAccuracy: true, maximumAge: 10000 });
            else gpsMsg = 'GPS not supported';
            try { if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) { if (await DeviceOrientationEvent.requestPermission() !== 'granted') gpsMsg = 'Motion permission denied' } } catch (e) { gpsMsg = 'Motion permission error' }
            addEventListener('deviceorientationabsolute', onOri, true); addEventListener('deviceorientation', onOri, true);
            $('intro').style.display = 'none'; resize()
        };
        frame();
    </script>
</body>

</html>
