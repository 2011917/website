<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
</head>

<body>
    <h1>Contact Page</h1>

    <!-- A simple form that sends data back to Python via POST -->
    <form action="/contact" method="POST">
        <label for="message">Send us a message:</label><br>
        <input type="text" id="message" name="user_message" required>
        <button type="submit">Submit</button>
    </form>

    <br>
    <a href="/">Back to Home</a>
</body>

</html>
